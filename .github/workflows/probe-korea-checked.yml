name: Probe Korea Checked deployment

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Probe DNS and HTTP
        shell: bash
        run: |
          set +e
          echo '=== DNS A ribbo.uk ==='
          dig +short ribbo.uk A
          echo '=== DNS AAAA ribbo.uk ==='
          dig +short ribbo.uk AAAA
          echo '=== DNS CNAME ribbo.uk ==='
          dig +short ribbo.uk CNAME
          echo '=== ribbo.uk HTTPS ==='
          curl -sSIL --max-time 20 https://ribbo.uk/ | head -n 20
          echo '=== GitHub Pages HTTPS ==='
          curl -sSIL --max-time 20 https://selena-ai-tech.github.io/my_english_ai_project/ | head -n 20
          echo '=== GitHub Pages canonical marker ==='
          curl -sSL --max-time 20 https://selena-ai-tech.github.io/my_english_ai_project/ | grep -o 'https://ribbo.uk' | head
