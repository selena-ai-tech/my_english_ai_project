name: Vendor WordPress assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy current WordPress media into the repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          curl -fsSL --retry 3 --retry-delay 2             'https://koreachecked.wordpress.com/wp-content/uploads/2026/09/korea-checked-brand-icon-512-v2.png'             -o assets/images/korea-checked-brand-icon-512-v2.png
          curl -fsSL --retry 3 --retry-delay 2             'https://koreachecked.wordpress.com/wp-content/uploads/2026/09/ec849cec9ab8_eca780ed9598ecb2a0_eab590ed86b5ecb9b4eb939c_ec84a0ed839d-1.png'             -o assets/images/t-money-vs-climate-card.png
          curl -fsSL --retry 3 --retry-delay 2             'https://koreachecked.wordpress.com/wp-content/uploads/2026/09/korean-baseball-night-editorial-visual.png'             -o assets/images/korean-baseball-night-editorial-visual.png
          curl -fsSL --retry 3 --retry-delay 2             'https://koreachecked.wordpress.com/wp-content/uploads/2026/09/korean-baseball-cheer-songs-editorial-visual.png'             -o assets/images/korean-baseball-cheer-songs-editorial-visual.png
          file assets/images/*.png
      - name: Commit vendored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images
          git diff --cached --quiet && exit 0
          git commit -m 'Vendor WordPress media assets'
          git push
